version: 2.1

orbs: 
  docker: circleci/docker@2.5.0
  ggshield: gitguardian/ggshield@1.1.4

workflows:
  build-and-publish:
    jobs:
      # - ggshield/scan:
      #     name: Scan using Gitguardian shield
      #     base_revision: <<pipeline.git.base_revision>>
      #     revision: <<pipeline.git.revision>>
      #     context:
      #       - gitguardian

      - docker/publish:
          name: Build and Publish to Docker Hub
          image: thinxcloud/mosquitto
          tag: latest
          # Publish only from main. Without this the job runs on every branch,
          # so any feature-branch push overwrites the production :latest tag.
          filters:
            branches:
              only: main
          # The Dockerfile's base images live on dhi.io, which rejects anonymous
          # pulls. Its auth realm delegates to registry.docker.io, so the same
          # Docker Hub credentials the orb already uses authenticate there too.
          before_build:
            - run:
                name: Log in to dhi.io for the hardened base image
                command: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_LOGIN" --password-stdin dhi.io
          context:
            - dockerhub